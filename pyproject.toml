[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spoligotyper"
dynamic = ["version"]
description = "In silico spoligotyping of Mycobacterium tuberculosis complex genomes from reads or assemblies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Marc-Olivier Duceppe", email = "marc-olivier.duceppe@inspection.gc.ca"}]
requires-python = ">=3.10"
keywords = ["bioinformatics", "spoligotyping", "mycobacterium", "tuberculosis", "bovis", "genotyping", "wgs", "report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Seal, from BBTools (https://sourceforge.net/projects/bbmap/), must also be installed: it is not available from PyPI.
dependencies = ["reportlab>=4.0"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=5", "pypdf>=4"]

[project.urls]
Homepage = "https://github.com/duceppemo/spoligotyper"
Documentation = "https://github.com/duceppemo/spoligotyper/wiki"
Changelog = "https://github.com/duceppemo/spoligotyper/wiki/Changelog"
Issues = "https://github.com/duceppemo/spoligotyper/issues"
DOI = "https://doi.org/10.5281/zenodo.22926160"

[project.scripts]
spoligotyper = "spoligotyper.cli:main"

[tool.setuptools]
packages = ["spoligotyper", "spoligotyper.data"]

[tool.setuptools.package-data]
"spoligotyper.data" = ["*.fasta", "*.txt", "*.tsv", "*.png", "*.md"]

[tool.setuptools.dynamic]
version = {attr = "spoligotyper.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["spoligotyper"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["UP031", "UP032"]  # str.format() is used throughout

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
